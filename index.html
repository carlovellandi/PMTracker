<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Summer 2027 PM / APM Tracker</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#667085;--line:#e4e7ec;
  --accent:#175cd3;--good:#067647;--warn:#b54708;--bad:#b42318;--purple:#6941c6;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.shell{max-width:1500px;margin:0 auto;padding:22px}
.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:16px}
h1{font-size:26px;line-height:1.15;margin:0 0 6px}.sub{color:var(--muted);max-width:900px}
.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;background:#fff}
.build{color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d0d5dd;background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:600;color:#344054}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.summary{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin:14px 0}
.metric{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px}.metric .n{font-size:22px;font-weight:800}.metric .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:9px;margin:12px 0}
input,select,textarea{font:inherit;border:1px solid #d0d5dd;border-radius:8px;padding:8px;background:#fff;color:var(--text)}
textarea{width:100%;min-height:72px;resize:vertical}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer;color:#475467}.tab.active{background:#101828;color:#fff;border-color:#101828}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.panelhead{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
.cards{padding:12px;display:grid;gap:10px}.card{border:1px solid var(--line);border-radius:11px;padding:13px;background:#fff}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.company{font-weight:800;font-size:16px}.role{color:#344054;margin-top:2px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{font-size:11px;border-radius:999px;padding:3px 7px;background:#f2f4f7;color:#475467}
.score{font-size:18px;font-weight:800;white-space:nowrap}.score small{font-size:10px;color:var(--muted);display:block;text-align:right}
.detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}.box{background:#f9fafb;border-radius:8px;padding:9px}.box b{display:block;font-size:11px;text-transform:uppercase;color:#667085;margin-bottom:3px}
.app-list{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.app{padding:7px 0;border-bottom:1px dashed var(--line)}.app:last-child{border-bottom:0}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.pipeline{overflow:auto}.pipeline table{width:100%;border-collapse:collapse;min-width:1150px}.pipeline th,.pipeline td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.pipeline th{font-size:11px;text-transform:uppercase;color:#667085;background:#f9fafb;position:sticky;top:0}.pipeline tr:hover td{background:#fcfcfd}
.stage{font-weight:800}.stage.Interviewing{color:var(--purple)}.stage.Offer{color:var(--good)}.stage.Rejected{color:var(--bad)}
.editor{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}.editor textarea{grid-column:1/-1}
.empty{padding:34px;text-align:center;color:var(--muted)}
.weekly{padding:15px;display:grid;gap:10px}.weekitem{padding:12px;border:1px solid var(--line);border-radius:10px}.urgent{border-color:#f79009;background:#fffaeb}
.note{font-size:12px;color:var(--muted)}
@media(max-width:900px){.summary{grid-template-columns:repeat(3,1fr)}.toolbar{grid-template-columns:1fr 1fr}.detail{grid-template-columns:1fr}.top{flex-direction:column}}
@media(max-width:560px){.shell{padding:12px}.summary{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div>
      <h1>Summer 2027 PM / APM Tracker</h1>
      <div class="sub"><span class="badge build">Build 2026-09-24.1</span> · Refreshed 2026-09-24. Action Queue is for unsubmitted live roles; Applications is your actual recruiting pipeline.</div>
    </div>
    <div class="actions">
      <button class="btn" id="exportBtn">Export progress</button>
      <label class="btn file">Import progress<input id="importFile" type="file" accept=".json,application/json"></label>
      <button class="btn" id="clearFilters">Reset filters</button>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="toolbar">
    <input id="search" placeholder="Search company, role, location, notes…">
    <select id="category"><option value="">All categories</option></select>
    <select id="eligibility"><option value="">All eligibility</option><option>Eligible</option><option>Verify</option><option>Stretch</option><option>Ineligible</option></select>
    <select id="statusFilter"><option value="">All role statuses</option></select>
    <select id="sort"><option value="action">Action score</option><option value="rank">Strategic rank</option><option value="company">Company A–Z</option></select>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="action">Action queue</button>
    <button class="tab" data-view="applications">Applications</button>
    <button class="tab" data-view="open">Open now</button>
    <button class="tab" data-view="soon">Opening soon</button>
    <button class="tab" data-view="watch">Watchlist</button>
    <button class="tab" data-view="all">All targets</button>
    <button class="tab" data-view="weekly">Weekly system</button>
  </div>

  <div class="panel">
    <div class="panelhead"><strong id="panelTitle">Action queue</strong><span class="note" id="resultCount"></span></div>
    <div id="content"></div>
  </div>
</div>

<script src="./data-2026-09-24-v1.js?v=2026-09-24.1"></script>
<script>
(() => {
  const EXPECTED_BUILD="2026-09-24.1";
  const DATA=window.PM_DASHBOARD_DATA;
  if(!DATA){document.body.innerHTML='<div style="padding:30px;font-family:system-ui">Could not load tracker data.</div>';return;}
  if(DATA.buildId!==EXPECTED_BUILD){
    document.body.insertAdjacentHTML("afterbegin",`<div style="background:#fff3cd;padding:10px 15px;font:600 13px system-ui">Cache mismatch: expected ${EXPECTED_BUILD}, loaded ${DATA.buildId||"unknown"}. Hard refresh.</div>`);
  }

  const K_COMP="pmTracker_companyProgress_v4";
  const K_APP="pmTracker_applicationProgress_v4";
  const legacyComp=["pmTracker_companyProgress_v3","pmTracker_companyProgress","pm_dashboard_progress"];
  const legacyApp=["pmTracker_applicationProgress_v3","pmTracker_applicationProgress","pm_dashboard_application_progress"];

  const readJSON=(k)=>{try{return JSON.parse(localStorage.getItem(k)||"{}")}catch{return {}}};
  let companyProgress=readJSON(K_COMP), applicationProgress=readJSON(K_APP);
  if(!Object.keys(companyProgress).length){for(const k of legacyComp){const v=readJSON(k);if(Object.keys(v).length){companyProgress=v;break}}}
  if(!Object.keys(applicationProgress).length){for(const k of legacyApp){const v=readJSON(k);if(Object.keys(v).length){applicationProgress=v;break}}}
  const save=()=>{localStorage.setItem(K_COMP,JSON.stringify(companyProgress));localStorage.setItem(K_APP,JSON.stringify(applicationProgress));};

  const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
  const records=DATA.records||[];
  const appIndex=new Map(), companyIndex=new Map();
  records.forEach(r=>{
    companyIndex.set(r.Company,r);
    (r.Applications||[]).forEach(a=>appIndex.set(`${r.Company}||APP||${a.id}`,{r,a}));
  });

  function companyKey(r){return `${r.Company}||${r["Program / Role"]}`;}
  function inferredCompanyStage(r){
    const statuses=(r.Applications||[]).map(a=>applicationProgress[`${r.Company}||APP||${a.id}`]?.status).filter(Boolean);
    if(statuses.includes("Offer")) return "Offer";
    if(statuses.includes("Interviewing")) return "Interviewing";
    if(statuses.includes("Applied")) return "Applied";
    return companyProgress[companyKey(r)]?.status || "Not started";
  }
  function isSubmitted(r){return ["Applied","Interviewing","Offer"].includes(inferredCompanyStage(r));}
  const actionEligible=r=>r.Status==="Open now" && !isSubmitted(r) && !["Ineligible"].includes(r["Eligibility Status"]) && r.Status!=="Ineligible";

  const els={content:document.getElementById("content"),title:document.getElementById("panelTitle"),count:document.getElementById("resultCount"),
    search:document.getElementById("search"),category:document.getElementById("category"),elig:document.getElementById("eligibility"),status:document.getElementById("statusFilter"),sort:document.getElementById("sort")};
  let view="action";

  [...new Set(records.map(r=>r["Strategic Track"]).filter(Boolean))].sort().forEach(v=>els.category.insertAdjacentHTML("beforeend",`<option>${esc(v)}</option>`));
  [...new Set(records.map(r=>r.Status).filter(Boolean))].sort().forEach(v=>els.status.insertAdjacentHTML("beforeend",`<option>${esc(v)}</option>`));

  function metrics(){
    const apps=Object.values(applicationProgress);
    const submitted=apps.filter(x=>["Applied","Interviewing","Offer"].includes(x.status)).length;
    const interviewing=apps.filter(x=>x.status==="Interviewing").length;
    const open=records.filter(r=>r.Status==="Open now").length;
    const queue=records.filter(actionEligible).length;
    const watch=records.filter(r=>["Watch","Future","Opens soon"].includes(r.Status)).length;
    const html=[
      [queue,"Action queue"],[submitted,"Submitted"],[interviewing,"Interviewing"],[open,"Open roles"],[watch,"Watch / upcoming"],[records.length,"Tracked"]
    ].map(([n,l])=>`<div class="metric"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
    document.getElementById("summary").innerHTML=html;
  }

  function searchable(r){
    return [r.Company,r["Program / Role"],r["Location(s)"],r["Strategic Track"],r["Why It Fits You"],r["Immediate Next Action"],r["Eligibility for You"]].join(" ").toLowerCase();
  }
  function filtered(list){
    const q=els.search.value.trim().toLowerCase(), cat=els.category.value, elig=els.elig.value, st=els.status.value;
    let x=list.filter(r=>(!q||searchable(r).includes(q))&&(!cat||r["Strategic Track"]===cat)&&(!elig||r["Eligibility Status"]===elig)&&(!st||r.Status===st));
    const mode=els.sort.value;
    x.sort((a,b)=>mode==="rank"?(a.Rank-b.Rank):mode==="company"?a.Company.localeCompare(b.Company):((b["Action Score"]||0)-(a["Action Score"]||0)||a.Rank-b.Rank));
    return x;
  }

  function roleCard(r){
    const stage=inferredCompanyStage(r);
    const apps=(r.Applications||[]).map(a=>{
      const k=`${r.Company}||APP||${a.id}`, p=applicationProgress[k]||{};
      return `<div class="app"><b>${esc(a.title)}</b> · <span class="pill">${esc(a.roleStatus||r.Status)}</span>
        ${a.deadline?`<span class="pill">Deadline: ${esc(a.deadline)}</span>`:""}
        ${p.status?`<span class="pill">My stage: ${esc(p.status)}</span>`:""}
        ${a.url?` · <a href="${esc(a.url)}" target="_blank" rel="noopener">posting</a>`:""}</div>`;
    }).join("");
    return `<div class="card">
      <div class="row"><div><div class="company">#${r.Rank} ${esc(r.Company)}</div><div class="role">${esc(r["Program / Role"])}</div></div>
      <div class="score">${Number(r["Action Score"]||0).toFixed(1)}<small>action</small></div></div>
      <div class="meta"><span class="pill">${esc(r.Status)}</span><span class="pill">${esc(r["Strategic Track"])}</span><span class="pill">${esc(r["Eligibility Status"]||"Verify")}</span>${stage!=="Not started"?`<span class="pill">My stage: ${esc(stage)}</span>`:""}</div>
      <div class="detail">
        <div class="box"><b>Why it fits</b>${esc(r["Why It Fits You"]||"")}</div>
        <div class="box"><b>Next action</b>${esc(r["Immediate Next Action"]||"")}</div>
        <div class="box"><b>Location / timing</b>${esc(r["Location(s)"]||"")}<br>${esc(r["Window / Deadline"]||"")}</div>
        <div class="box"><b>Eligibility</b>${esc(r["Eligibility for You"]||"")}</div>
      </div>
      ${apps?`<div class="app-list">${apps}</div>`:""}
    </div>`;
  }

  function renderCards(list,title){
    const x=filtered(list);
    els.title.textContent=title; els.count.textContent=`${x.length} shown`;
    els.content.innerHTML=x.length?`<div class="cards">${x.map(roleCard).join("")}</div>`:`<div class="empty">No roles match this view and filters.</div>`;
  }

  function pipelineRows(){
    const rows=[];
    for(const [k,p] of Object.entries(applicationProgress)){
      if(!p || !["Applied","Interviewing","Offer","Rejected","Withdrawn"].includes(p.status)) continue;
      const hit=appIndex.get(k);
      const company=k.split("||APP||")[0];
      const r=hit?.r || companyIndex.get(company);
      const a=hit?.a || {title:"Historical / legacy application",roleStatus:"Historical",url:"",location:""};
      rows.push({k,p,r,a,company,rank:r?.Rank??999});
    }
    const order={Offer:0,Interviewing:1,Applied:2,Rejected:3,Withdrawn:4};
    rows.sort((x,y)=>{
      if(order[x.p.status]!==order[y.p.status]) return order[x.p.status]-order[y.p.status];
      if(x.p.status==="Interviewing"&&y.p.status==="Interviewing"){
        const xd=x.p.nextStepDate||"9999-12-31", yd=y.p.nextStepDate||"9999-12-31";
        if(xd!==yd) return xd.localeCompare(yd);
      }
      const xd=x.p.appliedDate||"0000-00-00", yd=y.p.appliedDate||"0000-00-00";
      if(xd!==yd) return yd.localeCompare(xd);
      return x.rank-y.rank;
    });
    return rows;
  }

  function renderApplications(){
    els.title.textContent="Applications / recruiting pipeline";
    let rows=pipelineRows();
    const q=els.search.value.trim().toLowerCase(),cat=els.category.value;
    rows=rows.filter(x=>{
      const blob=[x.company,x.a.title,x.r?.["Strategic Track"],x.p.notes,x.p.nextStep].join(" ").toLowerCase();
      return (!q||blob.includes(q))&&(!cat||x.r?.["Strategic Track"]===cat);
    });
    els.count.textContent=`${rows.length} applications`;
    if(!rows.length){els.content.innerHTML='<div class="empty">No saved applications match these filters. Import your progress backup if needed.</div>';return;}
    els.content.innerHTML=`<div class="pipeline"><table><thead><tr>
      <th>Stage</th><th>Company / role</th><th>Next step</th><th>Applied</th><th>Category</th><th>Location</th><th>Notes</th><th>Posting</th>
      </tr></thead><tbody>${rows.map(x=>`<tr>
      <td><select data-k="${esc(x.k)}" data-f="status">
        ${["Applied","Interviewing","Offer","Rejected","Withdrawn"].map(s=>`<option ${x.p.status===s?"selected":""}>${s}</option>`).join("")}
      </select></td>
      <td><b>${esc(x.company)}</b><br><span class="note">${esc(x.a.title)}</span></td>
      <td><input data-k="${esc(x.k)}" data-f="nextStep" value="${esc(x.p.nextStep||"")}" placeholder="Next step"><br><input data-k="${esc(x.k)}" data-f="nextStepDate" type="date" value="${esc(x.p.nextStepDate||"")}"></td>
      <td><input data-k="${esc(x.k)}" data-f="appliedDate" type="date" value="${esc(x.p.appliedDate||"")}"></td>
      <td>${esc(x.r?.["Strategic Track"]||"")}</td><td>${esc(x.a.location||x.r?.["Location(s)"]||"")}</td>
      <td><textarea data-k="${esc(x.k)}" data-f="notes">${esc(x.p.notes||"")}</textarea></td>
      <td>${x.a.url?`<a href="${esc(x.a.url)}" target="_blank" rel="noopener">Open</a>`:"—"}</td>
      </tr>`).join("")}</tbody></table></div>`;
    els.content.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("change",()=>{
      const k=el.dataset.k,f=el.dataset.f;
      applicationProgress[k]=applicationProgress[k]||{};
      applicationProgress[k][f]=el.value;
      save(); metrics();
    }));
  }

  function renderWeekly(){
    els.title.textContent="Weekly operating system";
    els.count.textContent="";
    els.content.innerHTML=`<div class="weekly">
      <div class="weekitem urgent"><b>1. Jane Street interview trigger</b><div>Round 1: <strong>Oct. 7</strong>. This now outranks generic recruiting prep. Focus on structured reasoning, estimation/analytics, product-strategy judgment, and clear communication; add light pseudocode/SQL-style reasoning closer to the interview.</div></div>
      <div class="weekitem urgent"><b>2. Deadline sprint</b><div>Visa is the immediate Sep. 24/25 deadline. Workiva closes Sep. 27/28. Mutual of Omaha closes Sep. 30. Google is already submitted. Duolingo closes Oct. 7/8.</div></div>
      <div class="weekitem"><b>3. Best remaining applications</b><div>After urgent deadlines: Intuit → Skydio → Mastercard → Dedalus → Coinbase (only with honest crypto interest) → Capital One → IBM → Amgen → Cox Austin → DICK'S → Dow Jones.</div></div>
      <div class="weekitem"><b>4. Axon</b><div>Application is submitted and you now have two first-year LDP referrals/connections. Do not manufacture more outreach. Prepare if the process triggers.</div></div>
      <div class="weekitem"><b>5. Keep building</b><div>Continue product/AI experimentation that improves your interview stories. Dad Lore is the strongest AI-product build story; Let’s Go hook testing is strong experimentation/measurement evidence.</div></div>
    </div>`;
  }

  function render(){
    metrics();
    if(view==="applications"){renderApplications();return}
    if(view==="weekly"){renderWeekly();return}
    if(view==="action"){renderCards(records.filter(actionEligible),"Highest-priority action queue");return}
    if(view==="open"){renderCards(records.filter(r=>r.Status==="Open now"),"Open now");return}
    if(view==="soon"){renderCards(records.filter(r=>r.Status==="Opens soon"),"Opening soon");return}
    if(view==="watch"){renderCards(records.filter(r=>["Watch","Future"].includes(r.Status)),"Watchlist");return}
    renderCards(records,"All targets");
  }

  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");view=b.dataset.view;render();
  }));
  [els.search,els.category,els.elig,els.status,els.sort].forEach(el=>el.addEventListener(el.tagName==="INPUT"?"input":"change",render));
  document.getElementById("clearFilters").addEventListener("click",()=>{els.search.value="";els.category.value="";els.elig.value="";els.status.value="";els.sort.value="action";render();});

  document.getElementById("exportBtn").addEventListener("click",()=>{
    save();
    const c=readJSON(K_COMP),a=readJSON(K_APP);
    if(!Object.keys(c).length && !Object.keys(a).length){alert("There is no saved progress in this browser to export.");return;}
    const payload={schemaVersion:4,exportedAt:new Date().toISOString(),dataSnapshot:DATA.snapshotDate,counts:{companies:Object.keys(c).length,applications:Object.keys(a).length},progress:c,applicationProgress:a};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob),link=document.createElement("a");
    link.href=url;link.download=`pm_dashboard_progress_${new Date().toISOString().slice(0,10)}.json`;link.click();URL.revokeObjectURL(url);
  });

  document.getElementById("importFile").addEventListener("change",e=>{
    const f=e.target.files?.[0]; if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const x=JSON.parse(rd.result);
        const cp=x.progress||{},ap=x.applicationProgress||{};
        companyProgress={...companyProgress,...cp}; applicationProgress={...applicationProgress,...ap}; save();
        alert(`Imported ${Object.keys(cp).length} company records and ${Object.keys(ap).length} application records.`);
        render();
      }catch(err){alert("Could not import that JSON file.");}
    };
    rd.readAsText(f); e.target.value="";
  });

  save(); render();
})();
</script>
</body>
</html>
