<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Summer 2027 PM / APM Tracker</title>
  <meta name="description" content="Interactive tracker for Summer 2027 Product Management and APM recruiting." />
  <style>
    :root {
      --bg:#f5f7fb; --panel:#ffffff; --panel2:#f9fafb; --text:#111827; --muted:#667085;
      --border:#e4e7ec; --accent:#244c76; --accent2:#dbeafe; --green:#15803d; --green-bg:#dcfce7;
      --amber:#a16207; --amber-bg:#fef3c7; --red:#b42318; --red-bg:#fee4e2; --blue:#175cd3; --blue-bg:#eff8ff;
      --gray:#475467; --gray-bg:#f2f4f7; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color:var(--accent); }
    button, input, select { font:inherit; }
    .shell { max-width:1480px; margin:0 auto; padding:24px; }
    .topbar { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:18px; }
    h1 { font-size:28px; margin:0 0 5px; letter-spacing:-.02em; }
    .subtitle { color:var(--muted); font-size:14px; }
    .top-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
    .btn { border:1px solid var(--border); background:var(--panel); color:var(--text); padding:9px 12px; border-radius:9px; cursor:pointer; box-shadow:var(--shadow); }
    .btn:hover { border-color:#b9c2cf; }
    .btn.primary { background:var(--accent); color:white; border-color:var(--accent); }
    .file-label { display:inline-flex; align-items:center; }
    .file-label input { display:none; }

    .metrics { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
    .metric { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; box-shadow:var(--shadow); }
    .metric .k { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
    .metric .v { font-size:25px; font-weight:700; margin-top:4px; }
    .metric .s { color:var(--muted); font-size:12px; margin-top:2px; }

    .toolbar { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; display:grid;
      grid-template-columns:minmax(240px,2fr) repeat(4,minmax(135px,1fr)) auto; gap:10px; align-items:end; box-shadow:var(--shadow); }
    .field label { display:block; color:var(--muted); font-size:12px; margin:0 0 5px; }
    .field input,.field select { width:100%; border:1px solid var(--border); background:white; border-radius:8px; padding:9px 10px; color:var(--text); }
    .toolbar .btn { height:38px; }

    .tabs { display:flex; flex-wrap:wrap; gap:6px; margin:14px 0 10px; }
    .tab { border:1px solid transparent; background:transparent; color:var(--muted); padding:8px 11px; border-radius:8px; cursor:pointer; }
    .tab.active { background:var(--accent2); color:var(--accent); font-weight:600; }

    .content { display:grid; grid-template-columns:minmax(0,1fr) 365px; gap:14px; align-items:start; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
    .panel-head { padding:13px 15px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .panel-head strong { font-size:15px; }
    .count { color:var(--muted); font-size:13px; }

    .table-wrap { overflow:auto; max-height:70vh; }
    table { width:100%; border-collapse:collapse; min-width:1050px; }
    th { position:sticky; top:0; z-index:3; background:#f8fafc; color:#475467; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
      padding:10px; border-bottom:1px solid var(--border); text-align:left; cursor:pointer; white-space:nowrap; }
    td { border-bottom:1px solid #eef1f5; padding:11px 10px; vertical-align:top; font-size:13px; }
    tr:hover td { background:#fafcff; }
    td.num { text-align:center; }
    .company { font-weight:700; font-size:14px; }
    .role { color:#344054; margin-top:3px; max-width:260px; }
    .badge { display:inline-block; padding:4px 8px; border-radius:999px; font-size:11px; font-weight:650; white-space:nowrap; }
    .live { background:var(--green-bg); color:var(--green); }
    .soon { background:var(--amber-bg); color:var(--amber); }
    .verify { background:var(--blue-bg); color:var(--blue); }
    .monitor { background:var(--gray-bg); color:var(--gray); }
    .closed { background:var(--red-bg); color:var(--red); }
    .score { font-weight:700; }
    .bar { width:70px; height:7px; background:#eef2f6; border-radius:99px; overflow:hidden; margin-top:5px; }
    .bar span { display:block; height:100%; background:var(--accent); }
    .linkbtn { border:0; background:transparent; padding:0; color:var(--accent); cursor:pointer; font-weight:600; }
    .small { font-size:12px; color:var(--muted); }

    .side { position:sticky; top:14px; }
    .detail { padding:15px; max-height:75vh; overflow:auto; }
    .empty { padding:30px 20px; color:var(--muted); text-align:center; }
    .detail h2 { margin:0; font-size:20px; }
    .detail .role-title { color:#475467; margin:4px 0 10px; }
    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
    .chipbox { background:var(--panel2); border:1px solid var(--border); border-radius:9px; padding:9px; }
    .chipbox .lbl { color:var(--muted); font-size:11px; text-transform:uppercase; }
    .chipbox .val { font-weight:650; margin-top:3px; font-size:13px; }
    .section { margin-top:14px; }
    .section h3 { font-size:12px; color:#475467; text-transform:uppercase; letter-spacing:.05em; margin:0 0 5px; }
    .section p { margin:0; color:#344054; font-size:13px; line-height:1.45; white-space:pre-wrap; }
    .source-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .source-row a { display:inline-block; text-decoration:none; border:1px solid var(--border); border-radius:8px; padding:7px 9px; font-size:12px; }

    .progress-section { border-top:1px solid var(--border); margin-top:15px; padding-top:14px; }
    .progress-section select,.progress-section textarea { width:100%; border:1px solid var(--border); border-radius:8px; padding:9px; margin-top:5px; }
    .progress-section textarea { min-height:82px; resize:vertical; }
    .saved { color:var(--green); font-size:12px; margin-top:5px; min-height:16px; }

    .queue { padding:12px 15px; }
    .queue-item { padding:10px 0; border-bottom:1px solid #eef1f5; }
    .queue-item:last-child { border-bottom:0; }
    .queue-item b { display:block; }
    .queue-item p { margin:4px 0 0; color:#475467; font-size:13px; line-height:1.35; }

    .stale { color:var(--red); font-weight:600; }
    .fresh { color:var(--green); font-weight:600; }

    @media (max-width:1050px) {
      .metrics { grid-template-columns:repeat(3,1fr); }
      .toolbar { grid-template-columns:1fr 1fr 1fr; }
      .content { grid-template-columns:1fr; }
      .side { position:static; }
    }
    @media (max-width:680px) {
      .shell { padding:14px; }
      .topbar { flex-direction:column; }
      .top-actions { justify-content:flex-start; }
      .metrics { grid-template-columns:repeat(2,1fr); }
      .toolbar { grid-template-columns:1fr 1fr; }
      h1 { font-size:23px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div>
        <h1>Summer 2027 PM / APM Tracker</h1>
        <div class="subtitle" id="subtitle">Loading tracker…</div>
      </div>
      <div class="top-actions">
        <button class="btn" id="exportBtn">Export my progress</button>
        <label class="btn file-label">Import progress<input id="importFile" type="file" accept=".json,application/json"></label>
        <button class="btn primary" id="resetBtn">Reset filters</button>
      </div>
    </div>

    <section class="metrics" id="metrics"></section>

    <section class="toolbar">
      <div class="field"><label for="search">Search</label><input id="search" placeholder="Company, role, location, notes…"></div>
      <div class="field"><label for="statusFilter">Status</label><select id="statusFilter"><option value="">All statuses</option></select></div>
      <div class="field"><label for="fitFilter">Minimum fit</label><select id="fitFilter"></select></div>
      <div class="field"><label for="techFilter">Max technical bar</label><select id="techFilter"></select></div>
      <div class="field"><label for="progressFilter">My progress</label><select id="progressFilter"><option value="">All</option></select></div>
      <button class="btn" id="sortAction">Sort: Action score ↓</button>
    </section>

    <nav class="tabs">
      <button class="tab active" data-view="all">All targets</button>
      <button class="tab" data-view="action">Action queue</button>
      <button class="tab" data-view="live">Live / verify now</button>
      <button class="tab" data-view="human">Human checks</button>
      <button class="tab" data-view="prep">Prep priorities</button>
    </nav>

    <div class="content">
      <main class="panel">
        <div class="panel-head"><strong id="panelTitle">All targets</strong><span class="count" id="resultCount"></span></div>
        <div id="mainView"></div>
      </main>

      <aside class="panel side">
        <div class="panel-head"><strong>Target details</strong><span class="count">click any role</span></div>
        <div class="detail" id="detail"><div class="empty">Select a company to see the full role, fit rationale, technical expectations, sources and your own progress notes.</div></div>
      </aside>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    const DATA = window.PM_DASHBOARD_DATA;
    const records = DATA.records;
    const progressOptions = ["Not started","Researching","Networking","Ready to apply","Applied","Interviewing","Offer","Passed / skipped"];
    const storageKey = "pm2027-progress-v1";
    let progress = {};
    try { progress = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch(e) {}
    let view = "all";
    let sort = {key:"Action Score", dir:-1};
    let selectedKey = null;

    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];

    function keyFor(r){ return r.Company + "||" + r["Program / Role"]; }
    function statusClass(s=""){
      const x=s.toLowerCase();
      if(x.includes("ineligible") || x.includes("closed")) return "closed";
      if(x==="live") return "live";
      if(x.includes("opening")) return "soon";
      if(x.includes("verify")) return "verify";
      return "monitor";
    }
    function esc(v){ return String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
    function daysOld(d){
      if(!d) return null;
      const dt=new Date(d+"T00:00:00"); const now=new Date();
      return Math.floor((now-dt)/(1000*60*60*24));
    }
    function isActionable(r){
      const s=(r.Status||"").toLowerCase();
      return s==="live" || s.includes("verify") || s.includes("opening");
    }

    function initFilters(){
      const statuses=[...new Set(records.map(r=>r.Status).filter(Boolean))];
      $("#statusFilter").innerHTML += statuses.map(s=>`<option>${esc(s)}</option>`).join("");
      $("#fitFilter").innerHTML = [0,7,8,9,10].map(x=>`<option value="${x}">${x===0?"Any":x+"+"}</option>`).join("");
      $("#techFilter").innerHTML = [5,4,3,2,1].map(x=>`<option value="${x}">${x}</option>`).join("");
      $("#progressFilter").innerHTML += progressOptions.map(x=>`<option>${x}</option>`).join("");
      $("#subtitle").textContent = `30 targets • source snapshot ${DATA.snapshotDate} • site generated ${DATA.generatedDate}`;
    }

    function metricCards(){
      const live=records.filter(r=>r.Status==="Live").length;
      const soon=records.filter(r=>r.Status==="Opening soon").length;
      const verify=records.filter(r=>(r.Status||"").includes("verify") && !(r.Status||"").includes("ineligible")).length;
      const applied=records.filter(r=>(progress[keyFor(r)]||{}).status==="Applied").length;
      const interviewing=records.filter(r=>(progress[keyFor(r)]||{}).status==="Interviewing").length;
      const stale=records.filter(r=>{const d=daysOld(r["Last Verified"]); return d!==null && d>7 && !String(r.Status).includes("Closed");}).length;
      const items=[
        ["Live",live,"Verified openings"],
        ["Opening soon",soon,"Known near-term windows"],
        ["Human verify",verify,"Needs your browser"],
        ["Applied",applied,"Your progress"],
        ["Interviewing",interviewing,"Your progress"],
        ["Stale >7d",stale,"Needs re-check"],
      ];
      $("#metrics").innerHTML=items.map(([k,v,s])=>`<div class="metric"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");
    }

    function filtered(){
      const q=$("#search").value.trim().toLowerCase();
      const st=$("#statusFilter").value;
      const minFit=Number($("#fitFilter").value||0);
      const maxTech=Number($("#techFilter").value||5);
      const pf=$("#progressFilter").value;
      let out=records.filter(r=>{
        const blob=Object.values(r).join(" ").toLowerCase();
        const p=(progress[keyFor(r)]||{}).status || "Not started";
        return (!q || blob.includes(q))
          && (!st || r.Status===st)
          && ((r["User Fit (1-10)"]||0)>=minFit)
          && ((r["Tech Bar (1-5)"]||5)<=maxTech)
          && (!pf || p===pf);
      });
      if(view==="live") out=out.filter(r=>isActionable(r));
      if(view==="human") out=out.filter(r=>r["Human Check Needed"] && !String(r.Status).includes("Closed") && !String(r.Status).includes("ineligible"));
      if(view==="action") out=out.filter(r=>!String(r.Status).includes("Closed") && !String(r.Status).includes("ineligible")).slice();
      out.sort((a,b)=>{
        let av=a[sort.key], bv=b[sort.key];
        if(typeof av==="string") return av.localeCompare(bv)*sort.dir;
        return ((av??-999)-(bv??-999))*sort.dir;
      });
      if(view==="action") out=out.slice(0,12);
      return out;
    }

    function renderTable(){
      const out=filtered();
      $("#panelTitle").textContent = {
        all:"All targets", action:"Highest-priority action queue", live:"Live / verify now", human:"Human checks"
      }[view] || "All targets";
      $("#resultCount").textContent=`${out.length} shown`;

      const html=`<div class="table-wrap"><table>
        <thead><tr>
          <th data-sort="Rank">#</th>
          <th data-sort="Company">Company / role</th>
          <th data-sort="Status">Status</th>
          <th data-sort="Action Score">Action</th>
          <th data-sort="User Fit (1-10)">Fit</th>
          <th data-sort="Tech Bar (1-5)">Tech</th>
          <th data-sort="Competitiveness (1-5)">Comp.</th>
          <th>Location</th>
          <th>My progress</th>
          <th>Verified</th>
        </tr></thead><tbody>
        ${out.map(r=>{
          const pk=keyFor(r), p=progress[pk]||{}, age=daysOld(r["Last Verified"]);
          const stale=age!==null && age>7;
          return `<tr data-key="${esc(pk)}">
            <td class="num">${r.Rank??""}</td>
            <td><button class="linkbtn company" data-open="${esc(pk)}">${esc(r.Company)}</button><div class="role">${esc(r["Program / Role"])}</div></td>
            <td><span class="badge ${statusClass(r.Status)}">${esc(r.Status)}</span></td>
            <td class="num"><span class="score">${esc(r["Action Score"])}</span><div class="bar"><span style="width:${Math.max(0,Math.min(100,(r["Action Score"]||0)*10))}%"></span></div></td>
            <td class="num">${esc(r["User Fit (1-10)"])}/10</td>
            <td class="num">${esc(r["Tech Bar (1-5)"])}/5</td>
            <td class="num">${esc(r["Competitiveness (1-5)"])}/5</td>
            <td>${esc(r["Location(s)"])}</td>
            <td>${esc(p.status || "Not started")}${p.notes?`<div class="small">${esc(p.notes).slice(0,80)}${p.notes.length>80?"…":""}</div>`:""}</td>
            <td><span class="${stale?"stale":"fresh"}">${esc(r["Last Verified"])}</span>${age!==null?`<div class="small">${age}d ago</div>`:""}</td>
          </tr>`;
        }).join("")}
        </tbody></table></div>`;
      $("#mainView").innerHTML=html;
      $("#mainView").querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>selectRecord(b.dataset.open)));
      $("#mainView").querySelectorAll("th[data-sort]").forEach(th=>th.addEventListener("click",()=>{
        const k=th.dataset.sort;
        if(sort.key===k) sort.dir*=-1; else { sort={key:k,dir:k==="Company"?1:-1}; }
        render();
      }));
    }

    function renderHuman(){
      const out=filtered();
      $("#panelTitle").textContent="Human verification queue";
      $("#resultCount").textContent=`${out.length} checks`;
      $("#mainView").innerHTML=`<div class="queue">${out.map(r=>`
        <div class="queue-item">
          <b><button class="linkbtn" data-open="${esc(keyFor(r))}">${esc(r.Company)} — ${esc(r["Program / Role"])}</button></b>
          <p>${esc(r["Human Check Needed"])}</p>
          <p><strong>Next:</strong> ${esc(r["Immediate Next Action"])}</p>
        </div>`).join("") || `<div class="empty">Nothing currently matches your filters.</div>`}</div>`;
      $("#mainView").querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>selectRecord(b.dataset.open)));
    }

    function renderPrep(){
      $("#panelTitle").textContent="Prep priorities from your tracker";
      $("#resultCount").textContent="";
      const blocks=[
        ["1. Product sense","Segment users → identify pain points → prioritize → propose solutions → tradeoffs → success metrics."],
        ["2. Product analytics","Funnels, retention, activation, conversion, A/B tests and metric diagnosis."],
        ["3. Technical fluency","Be able to talk to engineers: frontend/backend, APIs, databases, dependencies, latency and AI basics. You do not need to become the engineer."],
        ["4. Requirements & execution","Practice turning a vague product goal into requirements, engineering steps, dependencies, timeline, launch criteria and measurement."],
        ["5. SQL","Useful credibility boost: SELECT, WHERE, GROUP BY, JOIN, aggregates and simple window functions."],
        ["6. Your product stories","Dad Lore: problem → user → choices → prototype → iteration. Let’s Go: digital platform/content experiments → metrics → iteration."],
      ];
      $("#mainView").innerHTML=`<div class="queue">${blocks.map(([h,p])=>`<div class="queue-item"><b>${h}</b><p>${p}</p></div>`).join("")}</div>`;
    }

    function selectRecord(k){
      selectedKey=k;
      const r=records.find(x=>keyFor(x)===k);
      if(!r) return;
      const p=progress[k]||{};
      const link=(url,label)=>url?`<a href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`:"";
      $("#detail").innerHTML=`
        <h2>${esc(r.Company)}</h2>
        <div class="role-title">${esc(r["Program / Role"])}</div>
        <span class="badge ${statusClass(r.Status)}">${esc(r.Status)}</span>
        <div class="detail-grid">
          <div class="chipbox"><div class="lbl">Action score</div><div class="val">${esc(r["Action Score"])}/10</div></div>
          <div class="chipbox"><div class="lbl">Fit</div><div class="val">${esc(r["User Fit (1-10)"])}/10</div></div>
          <div class="chipbox"><div class="lbl">Tech bar</div><div class="val">${esc(r["Tech Bar (1-5)"])}/5</div></div>
          <div class="chipbox"><div class="lbl">Competition</div><div class="val">${esc(r["Competitiveness (1-5)"])}/5</div></div>
        </div>
        ${section("Window / deadline",r["Window / Deadline"])}
        ${section("Location",r["Location(s)"])}
        ${section("Eligibility",r["Eligibility for You"])}
        ${section("Degree / major",r["Degree / Major Notes"])}
        ${section("Technical expectations",r["Technical Knowledge Expected"])}
        ${section("Why it fits you",r["Why It Fits You"])}
        ${section("Interview / recruiting",r["Recruiting / Interview Notes"])}
        ${section("Compensation",r.Compensation)}
        ${section("Immediate next action",r["Immediate Next Action"])}
        ${section("Human check",r["Human Check Needed"])}
        <div class="source-row">${link(r["Official Source"],"Official source")}${link(r["Secondary / Exact Posting"],"Secondary / exact posting")}</div>
        <div class="small" style="margin-top:10px">Last verified: ${esc(r["Last Verified"])}</div>
        <div class="progress-section">
          <h3 style="margin:0">My recruiting progress</h3>
          <label class="small" for="personalStatus">Status</label>
          <select id="personalStatus">${progressOptions.map(x=>`<option ${x===(p.status||"Not started")?"selected":""}>${x}</option>`).join("")}</select>
          <label class="small" for="personalNotes" style="display:block;margin-top:8px">Notes / contacts / next step</label>
          <textarea id="personalNotes" placeholder="e.g. John Russell referral path; applied 9/4; follow up with recruiter…">${esc(p.notes||"")}</textarea>
          <div class="saved" id="savedMsg"></div>
        </div>`;
      $("#personalStatus").addEventListener("change",saveProgress);
      $("#personalNotes").addEventListener("input",debounce(saveProgress,350));
    }

    function section(h,v){
      if(v===null || v===undefined || v==="") return "";
      return `<div class="section"><h3>${esc(h)}</h3><p>${esc(v)}</p></div>`;
    }
    let debounceTimer;
    function debounce(fn,ms){ return (...args)=>{clearTimeout(debounceTimer);debounceTimer=setTimeout(()=>fn(...args),ms);} }
    function saveProgress(){
      if(!selectedKey) return;
      progress[selectedKey]={status:$("#personalStatus").value,notes:$("#personalNotes").value};
      localStorage.setItem(storageKey,JSON.stringify(progress));
      $("#savedMsg").textContent="Saved in this browser";
      metricCards();
    }

    function render(){
      metricCards();
      if(view==="prep") return renderPrep();
      if(view==="human") return renderHuman();
      renderTable();
    }

    $$(".tab").forEach(t=>t.addEventListener("click",()=>{
      $$(".tab").forEach(x=>x.classList.remove("active")); t.classList.add("active"); view=t.dataset.view; render();
    }));
    ["search","statusFilter","fitFilter","techFilter","progressFilter"].forEach(id=>$("#"+id).addEventListener(id==="search"?"input":"change",render));
    $("#resetBtn").addEventListener("click",()=>{
      $("#search").value=""; $("#statusFilter").value=""; $("#fitFilter").value="0"; $("#techFilter").value="5"; $("#progressFilter").value="";
      view="all"; sort={key:"Action Score",dir:-1}; $$(".tab").forEach((x,i)=>x.classList.toggle("active",i===0)); render();
    });
    $("#sortAction").addEventListener("click",()=>{sort={key:"Action Score",dir:-1}; render();});
    $("#exportBtn").addEventListener("click",()=>{
      const payload=JSON.stringify({exportedAt:new Date().toISOString(),progress},null,2);
      const blob=new Blob([payload],{type:"application/json"}); const url=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=url; a.download="pm_dashboard_progress.json"; a.click(); URL.revokeObjectURL(url);
    });
    $("#importFile").addEventListener("change",async e=>{
      const f=e.target.files[0]; if(!f) return;
      try {
        const x=JSON.parse(await f.text()); progress=x.progress||x; localStorage.setItem(storageKey,JSON.stringify(progress)); metricCards(); render();
        alert("Progress imported.");
      } catch(err){ alert("Could not import that JSON file."); }
    });

    initFilters();
    render();
  </script>
